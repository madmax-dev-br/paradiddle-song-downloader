name: Build Release

on:
  push:
    branches:
      - release
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript
        run: npm run check

      - name: Package Windows
        run: npm run package:win

      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Paradiddle Song Downloader-win32-x64/*" -DestinationPath "Paradiddle-Song-Downloader-win32-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paradiddle-Song-Downloader-win32-x64
          path: Paradiddle-Song-Downloader-win32-x64.zip

  build-mac:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript
        run: npm run check

      - name: Package macOS
        run: npm run package:mac:${{ matrix.arch }}

      - name: Zip macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Paradiddle Song Downloader-darwin-${{ matrix.arch }}/Paradiddle Song Downloader.app" "Paradiddle-Song-Downloader-mac-${{ matrix.arch }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paradiddle-Song-Downloader-mac-${{ matrix.arch }}
          path: Paradiddle-Song-Downloader-mac-${{ matrix.arch }}.zip

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-mac

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_type == 'tag' && github.ref_name || format('release-{0}', github.run_number) }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_type == 'tag' && github.ref_name || format('release-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: release-assets/**/*.zip
          draft: false
          prerelease: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}
